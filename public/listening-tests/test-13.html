.Un aménagement territorial en fonction des données météorologiques.","B.Un programme de réduction des différentes sources de pollution.","C.Une analyse comparative entre les modes de vie citadins et ruraux.","D.Une proposition de prévention renforcée des grands cataclysmes."],"correct":"B","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test13/test13_q34_audio.mp3","image":""},{"number":35,"question":"","options":["A.La perte de sa liberté intellectuelle.","B.Les nombreux voyages à l’étranger.","C.Un manque de reconnaissance.","D.Une rémunération insuffisante."],"correct":"A","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test13/test13_q35_audio.mp3","image":""},{"number":36,"question":"","options":["A.Il conditionne l’humeur.","B.Il dope l’énergie.","C.Il minimise l’angoisse.","D.Il stimule la créativité."],"correct":"D","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test13/test13_q36_audio.mp3","image":""},{"number":37,"question":"","options":["A.D’affiner l’écoute entre musiciens.","B.D’exprimer l’originalité d’une interprétation.","C.De faire varier le répertoire des concerts.","D.De perfectionner la technique du violoniste."],"correct":"A","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test13/test13_q37_audio.mp3","image":""},{"number":38,"question":"","options":["A.Elles demandent un nouveau statut juridique","B.Elles exigent des garanties réelles et tangibles","C.Elles mettent en doute la viabilité du projet","D.Elles veulent que les terres restent intactes"],"correct":"B","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test13/test13_q38_audio.mp3","image":""},{"number":39,"question":"","options":["A.Elles entrainent des dépendances maladives.","B.Elles nuisent aux capacités d’apprentissage.","C.Elles perturbent la perception de la réalité.","D.Elles provoquent un isolement dangereux."],"correct":"A","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test13/test13_q39_audio.mp3","image":""}];

let current = 0;

const responses =
  Array(QUESTIONS.length).fill(null);

const checked =
  Array(QUESTIONS.length).fill(false);

function letter(i) {
  return String.fromCharCode(65 + i);
}

function choose(i) {
  if (checked[current]) return;

  responses[current] = i;
  render();
}

function checkAnswer() {

  if (responses[current] === null) {
    alert('Please select an answer first.');
    return;
  }

  checked[current] = true;
  render();
}

function next() {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
  }
}

function previous() {
  if (current > 0) {
    current--;
    render();
  }
}

function goTo(index) {
  current = index;
  render();
}

function finish() {

  let score = 0;

  QUESTIONS.forEach((q, i) => {

    if (
      responses[i] !== null &&
      letter(responses[i]) === q.correct
    ) {
      score++;
    }
  });

  const percent =
    Math.round(
      score / QUESTIONS.length * 100
    );

  const box =
    document.getElementById('results');

  box.style.display = 'block';

  box.innerHTML = `
    <div class="score">
      ${score}/${QUESTIONS.length}
    </div>

    <p>
      Score: ${percent}%
    </p>
  `;

  box.scrollIntoView({
    behavior: 'smooth'
  });
}

function resetTest() {

  if (!confirm('Reset the complete test?')) {
    return;
  }

  responses.fill(null);
  checked.fill(false);
  current = 0;

  document.getElementById(
    'results'
  ).style.display = 'none';

  render();
}

function renderNavigation() {

  const nav =
    document.getElementById('nav');

  nav.innerHTML = '';

  QUESTIONS.forEach((q, i) => {

    const b =
      document.createElement('button');

    b.textContent =
      'Q' + q.number;

    if (i === current) {
      b.classList.add('current');
    }

    if (responses[i] !== null) {
      b.classList.add('answered');
    }

    b.onclick =
      () => goTo(i);

    nav.appendChild(b);
  });
}

function render() {

  const q =
    QUESTIONS[current];

  document.getElementById(
    'progress'
  ).textContent =
    'Question ' +
    (current + 1) +
    ' of ' +
    QUESTIONS.length;

  let image = '';

  if (q.image) {
    image = `
      <img
        src="${q.image}"
        class="question-image"
        alt="Question image"
      >
    `;
  }

  let audio = `
    <audio
      controls
      preload="metadata"
      src="${q.audio}"
    ></audio>
  `;

  let options = '';

  q.options.forEach((option, i) => {

    const classes =
      ['option'];

    if (
      responses[current] === i
    ) {
      classes.push('selected');
    }

    if (checked[current]) {

      if (
        letter(i) === q.correct
      ) {
        classes.push('correct');
      }

      if (
        responses[current] === i &&
        letter(i) !== q.correct
      ) {
        classes.push('wrong');
      }
    }

    options += `
      <button
        class="${classes.join(' ')}"
        onclick="choose(${i})"
      >
        ${option}
      </button>
    `;
  });

  let feedback = '';

  if (checked[current]) {

    const selected =
      letter(responses[current]);

    feedback =
      selected === q.correct
        ? '✓ Correct'
        : 'Correct answer: ' + q.correct;
  }

  document.getElementById(
    'card'
  ).innerHTML = `

    ${image}

    ${audio}

    <div class="question-text">
      ${q.question || ''}
    </div>

    ${options}

    <div class="feedback">
      ${feedback}
    </div>

    <div class="controls">

      <button
        class="btn secondary"
        onclick="previous()"
      >
        ← Previous
      </button>

      <button
        class="btn primary"
        onclick="checkAnswer()"
      >
        Check Answer
      </button>

      <button
        class="btn secondary"
        onclick="next()"
      >
        Next →
      </button>

      <button
        class="btn primary"
        onclick="finish()"
      >
        Finish Test
      </button>

      <button
        class="btn secondary"
        onclick="resetTest()"
      >
        Reset
      </button>

    </div>
  `;

  renderNavigation();
}

render();

</script>
