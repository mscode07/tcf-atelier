["A.C’est la solution actuellement la plus adaptée à ce problème scolaire.","B.Elle permet de faire évoluer le regard des jeunes sur l’école.","C.Il faut éviter de mélanger aspects éducatif et ludique à l’école.","D.Les nouvelles technologies à l’école sont mal perçues par les familles."],"correct":"B","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test27/test27_q34_audio.mp3","image":""},{"number":35,"question":"","options":["A.La multiplication des intervenants nuit à l’efficacité de sa communication.","B.Les actions d’information ont rouvert le dialogue avec les Québécois.","C.Les habitants sont indifférents à l’une des richesses du Québec.","D.L’expansion urbaine contrarie l’exploitation industrielle du bois."],"correct":"C","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test27/test27_q35_audio.mp3","image":""},{"number":36,"question":"","options":["A.Il est commun à toutes les cultures.","B.Il est le propre des êtres humains.","C.Il est lié à une grande intelligence.","D.Il est reproductible artificiellement."],"correct":"B","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test27/test27_q36_audio.mp3","image":""},{"number":37,"question":"","options":["A.Des articles neufs à prix imbattable.","B.Des chaussures en matières recyclées.","C.Un mode de consommation durable.","D.Un type inédit de magasin associatif."],"correct":"C","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test27/test27_q37_audio.mp3","image":""},{"number":38,"question":"","options":["A.La mauvaise qualité des composants employés.","B.L’absence de consultation des futurs occupants.","C.Le manque d’audace des projets architecturaux.","D.Les retards systématiques pris par les chantiers."],"correct":"B","audio":"https://fuck-tcf-media.satyanarayana1999-sn.workers.dev/downloads/test27/test27_q38_audio.mp3","image":""},{"number":39,"question":"","options":["A.Elle déplore le manque de structur let current = 0;

const responses =
  Array(QUESTIONS.length).fill(null);

const checked =
  Array(QUESTIONS.length).fill(false);

function letter(i) {
  return String.fromCharCode(65 + i);
}

function choose(i) {
  if (checked[current]) return;

  responses[current] = i;
  render();
}

function checkAnswer() {

  if (responses[current] === null) {
    alert('Please select an answer first.');
    return;
  }

  checked[current] = true;
  render();
}

function next() {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
  }
}

function previous() {
  if (current > 0) {
    current--;
    render();
  }
}

function goTo(index) {
  current = index;
  render();
}

function finish() {

  let score = 0;

  QUESTIONS.forEach((q, i) => {

    if (
      responses[i] !== null &&
      letter(responses[i]) === q.correct
    ) {
      score++;
    }
  });

  const percent =
    Math.round(
      score / QUESTIONS.length * 100
    );

  const box =
    document.getElementById('results');

  box.style.display = 'block';

  box.innerHTML = `
    <div class="score">
      ${score}/${QUESTIONS.length}
    </div>

    <p>
      Score: ${percent}%
    </p>
  `;

  box.scrollIntoView({
    behavior: 'smooth'
  });
}

function resetTest() {

  if (!confirm('Reset the complete test?')) {
    return;
  }

  responses.fill(null);
  checked.fill(false);
  current = 0;

  document.getElementById(
    'results'
  ).style.display = 'none';

  render();
}

function renderNavigation() {

  const nav =
    document.getElementById('nav');

  nav.innerHTML = '';

  QUESTIONS.forEach((q, i) => {

    const b =
      document.createElement('button');

    b.textContent =
      'Q' + q.number;

    if (i === current) {
      b.classList.add('current');
    }

    if (responses[i] !== null) {
      b.classList.add('answered');
    }

    b.onclick =
      () => goTo(i);

    nav.appendChild(b);
  });
}

function render() {

  const q =
    QUESTIONS[current];

  document.getElementById(
    'progress'
  ).textContent =
    'Question ' +
    (current + 1) +
    ' of ' +
    QUESTIONS.length;

  let image = '';

  if (q.image) {
    image = `
      <img
        src="${q.image}"
        class="question-image"
        alt="Question image"
      >
    `;
  }

  let audio = `
    <audio
      controls
      preload="metadata"
      src="${q.audio}"
    ></audio>
  `;

  let options = '';

  q.options.forEach((option, i) => {

    const classes =
      ['option'];

    if (
      responses[current] === i
    ) {
      classes.push('selected');
    }

    if (checked[current]) {

      if (
        letter(i) === q.correct
      ) {
        classes.push('correct');
      }

      if (
        responses[current] === i &&
        letter(i) !== q.correct
      ) {
        classes.push('wrong');
      }
    }

    options += `
      <button
        class="${classes.join(' ')}"
        onclick="choose(${i})"
      >
        ${option}
      </button>
    `;
  });

  let feedback = '';

  if (checked[current]) {

    const selected =
      letter(responses[current]);

    feedback =
      selected === q.correct
        ? '✓ Correct'
        : 'Correct answer: ' + q.correct;
  }

  document.getElementById(
    'card'
  ).innerHTML = `

    ${image}

    ${audio}

    <div class="question-text">
      ${q.question || ''}
    </div>

    ${options}

    <div class="feedback">
      ${feedback}
    </div>

    <div class="controls">

      <button
        class="btn secondary"
        onclick="previous()"
      >
        ← Previous
      </button>

      <button
        class="btn primary"
        onclick="checkAnswer()"
      >
        Check Answer
      </button>

      <button
        class="btn secondary"
        onclick="next()"
      >
        Next →
      </button>

      <button
        class="btn primary"
        onclick="finish()"
      >
        Finish Test
      </button>

      <button
        class="btn secondary"
        onclick="resetTest()"
      >
        Reset
      </button>

    </div>
  `;

  renderNavigation();
}

render();

</script>
